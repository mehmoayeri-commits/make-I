<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make I</title><style>
*{box-sizing:border-box}body{margin:0;background:#18181b;color:#eee;font:16px system-ui;display:flex;height:100dvh}aside{background:#101012;width:220px;padding:24px}main{flex:1;min-width:0;display:flex;flex-direction:column}header{padding:20px;border-bottom:1px solid #ffffff18;font-weight:bold}button{background:#8065e8;color:white;border:0;border-radius:12px;padding:12px;cursor:pointer;font:inherit}aside button{width:100%;margin-top:20px}#chat{flex:1;overflow:auto;padding:24px max(20px,calc((100% - 760px)/2));display:flex;flex-direction:column;gap:24px}h1{text-align:center;margin:auto;font-size:32px}article{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}article.user{background:#34343b;padding:12px 18px;border-radius:20px;align-self:flex-end;max-width:85%}footer{padding:12px max(16px,calc((100% - 760px)/2));}form{display:flex;gap:8px;background:#303036;padding:10px;border-radius:24px}textarea{flex:1;min-width:0;background:transparent;color:inherit;border:0;resize:vertical;font:inherit;padding:8px;outline:none}small{display:block;text-align:center;color:#aaa;margin:10px}#code{background:#303036;color:white;border:1px solid #666;border-radius:8px;padding:10px;width:100%;margin-top:16px}@media(max-width:600px){aside{width:110px;padding:10px}aside button{font-size:12px}#code{font-size:12px}h1{font-size:24px}}
</style><aside><strong>✳ Make I</strong><button id="new">+ Nieuwe chat</button><input id="code" type="password" placeholder="Toegangscode" aria-label="Toegangscode"></aside><main><header>Make I · AI</header><section id="chat"><h1>Waar kan ik je mee helpen?</h1></section><footer><form><textarea required maxlength="4000" placeholder="Vraag Make I iets…" aria-label="Bericht"></textarea><button id="send">↑</button></form><small>AI kan fouten maken. Controleer belangrijke antwoorden.</small></footer></main><script>
let messages=[],busy=false;const chat=document.querySelector('#chat'),form=document.querySelector('form'),input=document.querySelector('textarea'),send=document.querySelector('#send');function add(role,content){const a=document.createElement('article');a.className=role;a.textContent=(role==='assistant'?'✳ Make I\n':'')+content;chat.append(a);chat.scrollTop=chat.scrollHeight;return a}document.querySelector('#new').onclick=()=>{if(busy)return;messages=[];chat.innerHTML='<h1>Waar kan ik je mee helpen?</h1>'};form.onsubmit=async e=>{e.preventDefault();if(busy)return;const content=input.value.trim();if(!content)return;chat.querySelector('h1')?.remove();add('user',content);messages.push({role:'user',content});input.value='';busy=true;send.disabled=true;const pending=add('assistant','Even denken…');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-access-code':document.querySelector('#code').value},body:JSON.stringify({messages:messages.slice(-23)})});const d=await r.json();if(!r.ok)throw Error(d.error);messages.push({role:'assistant',content:d.answer});pending.textContent='✳ Make I\n'+d.answer}catch(e){pending.textContent=e.message;messages.pop()}finally{busy=false;send.disabled=false;chat.scrollTop=chat.scrollHeight}};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}};
</script></html>
