function prose(node,text){for(const line of text.split(/\r?\n/)){const h=line.match(/^(#{1,6})\s+(.*)$/);const p=document.createElement(h?'h'+Math.min(4,h[1].length+1):'div');const t=h?h[2]:line.replace(/^[-*]\s+/,'• ');for(const part of t.split(/(\*\*[^*]+\*\*|`[^`]+`)/g)){if(!part)continue;const el=part.startsWith('**')?document.createElement('strong'):part.startsWith('`')?document.createElement('code'):null;if(el){el.textContent=part.startsWith('**')?part.slice(2,-2):part.slice(1,-1);p.append(el)}else p.append(document.createTextNode(part))}if(!t)p.append(document.createElement('br'));node.append(p)}}
function renderAnswer(node,answer){node.replaceChildren();const pattern=/^```([\w.+-]*)[ \t]*(?:filename=([^\r\n]+))?[ \t]*\r?\n([\s\S]*?)\r?\n```[ \t]*$/gm;let last=0;for(const m of answer.matchAll(pattern)){prose(node,answer.slice(last,m.index));if(m[2]){const name=m[2].trim().replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,100)||'bestand.txt';const b=document.createElement('button');b.type='button';b.textContent='↓ Download '+name;b.style.cssText='display:block;margin:10px 0;background:#34343b;border:1px solid #666';b.onclick=()=>{const url=URL.createObjectURL(new Blob([m[3]],{type:'application/octet-stream'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};node.append(b)}else{const pre=document.createElement('pre');pre.style.cssText='white-space:pre-wrap;background:#101012;padding:12px;border-radius:10px';pre.textContent=m[3];node.append(pre)}last=m.index+m[0].length}const tail=answer.slice(last);const cut=tail.search(/^```[^\n]*filename=/m);prose(node,cut<0?tail:tail.slice(0,cut)+'\nBestand niet voltooid. Vraag om een kleiner bestand.');}
function addFiles(node,files){for(const f of files){const b=document.createElement('button');b.type='button';b.textContent='↓ Download '+f.name;b.style.cssText='display:block;margin:12px 0;background:#34343b;border:1px solid #666;padding:12px;border-radius:10px';b.onclick=()=>{const url=URL.createObjectURL(new Blob([f.content],{type:'application/octet-stream'}));const a=document.createElement('a');a.href=url;a.download=f.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};node.append(b)}}
let messages=[],busy=false;const chat=document.querySelector('#chat'),form=document.querySelector('form'),input=document.querySelector('textarea'),send=document.querySelector('#send');function add(role,content){const a=document.createElement('article');a.className=role;a.append(document.createTextNode(content));chat.append(a);chat.scrollTop=chat.scrollHeight;return a}document.querySelector('#new').onclick=()=>{if(busy)return;messages=[];chat.innerHTML='<h1>Waar kan ik je mee helpen?</h1>'};form.onsubmit=async e=>{e.preventDefault();if(busy)return;const content=input.value.trim();if(!content)return;chat.querySelector('h1')?.remove();add('user',content);messages.push({role:'user',content});input.value='';busy=true;send.disabled=true;const pending=add('assistant','Even denken…');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages.slice(-23)})});let d;try{d=await r.json()}catch{throw Error('Serverfout. Controleer Vercel.')}if(!r.ok)throw Error(d.error);const files=Array.isArray(d.files)?d.files:[];messages.push({role:'assistant',content:d.answer+(files.length?'\n'+JSON.stringify(files):'')});renderAnswer(pending,d.answer);addFiles(pending,files)}catch(e){pending.textContent=e.message;messages.pop()}finally{busy=false;send.disabled=false;chat.scrollTop=chat.scrollHeight}};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}};
</script></html>
